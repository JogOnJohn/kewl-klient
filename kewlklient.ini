; kewlklient.ini -- sits next to kewlklient.dll. Edit this, not the code.

[kewlklient]
; Where your JDK lives. This is the one setting you MUST change.
; It needs bin\server\jvm.dll under it -- a JDK always has that, some JREs do not.
java=C:\Program Files\Java\jdk-21

[woodcutter]
; The example plugin. It re-clicks one tree every four seconds. Toggle in-game with F5.
;
; tree = the object id. 1278 is an ordinary tree. Look ids up on the OSRS wiki, or read them out of the
;        cache once somebody writes the object-scan contribution described in the README.
; x, y = the WORLD coordinates of the tile the tree stands on. Your minimap coordinates, not scene ones.
;
; The defaults below are a tree just north of Lumbridge castle. Change them to wherever you actually are.
tree=1278
x=3163
y=3441
